[project]
name = "workation-backend"
version = "0.1.0"
description = "워케이션맵 API 서버"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.18,<4",
    "psycopg[binary]>=3.3",
    "django-environ>=0.14",
    "gunicorn>=26",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# db/ 는 데이터 담당의 SQL·생성 스크립트라 검사하지 않는다
extend-exclude = ["**/migrations", "db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# db/schema.sql 이 기준이라 NULL 허용 문자열 컬럼(null=True CharField)을 그대로 옮긴다
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
