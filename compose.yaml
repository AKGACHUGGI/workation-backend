# 로컬 테스트 DB · 탐색 그래프 Neo4j · 캐시 Redis. 앱 · Traefik 은 배포 세팅 때 추가한다.
# 단위 테스트는 test-db 만 있으면 된다: docker compose up -d --wait test-db
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_DB_PORT:-5432}:5432"   # 5432 를 다른 DB 가 쓰면 TEST_DB_PORT=5433 으로 (테스트 설정도 같은 변수를 읽음)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 탐색 그래프 (Postgres 의 읽기 전용 복사본). 포트는 이 컴퓨터에서만 연다 (스펙 §5-2)
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localpassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 캐시 (홈 검색 · 탐색 · throttle 공용). 앱은 REDIS_URL=redis://localhost:6379/0
  # 단위 테스트는 Redis 없이 돈다 (settings_test 는 메모리 캐시)
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neo4j-data:
