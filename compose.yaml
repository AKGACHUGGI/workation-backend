# 로컬 테스트 전용 DB. 앱 · Traefik · Redis 는 배포 세팅 때 추가한다.
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_DB_PORT:-5432}:5432"   # 5432 를 다른 DB 가 쓰면 TEST_DB_PORT=5433 으로 (테스트 설정도 같은 변수를 읽음)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
